packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild
  - sharp

# Scoped security overrides retained for pinned transitive dependencies.
# Vercel CLI is removed; these also prevent unsafe versions on reintroduction.
overrides:
  # GHSA-68fv-2mgg-jv7q: reject invalid indexed source-map offsets.
  'source-map-js@1.2.1': 1.2.2
  # GHSA-238p-pmpm-9mq7: ignore inherited renderer trust/settings.
  'katex@<0.18.2': 0.18.2
  '@tootallnate/once@2.0.0': 2.0.1
  'ajv@8.6.3': 8.20.0
  'js-yaml@4.1.1': 4.3.2
  'minimatch@10.1.1': 10.2.6
  'path-to-regexp@6.1.0': 6.3.0
  'path-to-regexp@8.2.0': 8.4.2
  'path-to-regexp@8.3.0': 8.4.2
  'smol-toml@1.5.2': 1.9.0
  'tar@7.5.7': 7.5.22
  'tar@7.5.11': 7.5.22
  # 5.x has no release fixing all reported advisories; CLI uses fetch/Agent.
  'undici@5.28.4': 6.28.1
  'undici@5.29.0': 6.28.1
  # EVE pins 8.9.0; patch WebSocket DoS and BalancedPool TLS validation.
  'undici@8.9.0': 8.10.2
