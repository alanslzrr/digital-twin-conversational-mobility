name: Implementation task
description: Scope a mobility-domain implementation with verifiable acceptance criteria.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Data access, security, costs and dependencies
  - type: dropdown
    id: release
    attributes:
      label: Expected release impact
      options:
        - Requires maintainer decision
        - User-visible or security change — release expected
        - Documentation or internal tooling only — release may not be needed
    validations:
      required: true
