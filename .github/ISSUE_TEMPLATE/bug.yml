name: Bug report
description: Report reproducible behavior without private data or credentials.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use the private reporting channel in SECURITY.md. Do not paste credentials, conversation transcripts or personal travel histories."
  - type: input
    id: version
    attributes:
      label: Commit and environment
      description: Commit SHA, Node/pnpm versions and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a sanitized offline reproduction.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
