name: PR governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Initial policy introduction
        if: hashFiles('scripts/check-pr-policy.mjs') == ''
        run: echo "::notice::Bootstrap PR; maintainer must run the proposed checker locally before merge."
      - run: node --test scripts/check-pr-policy.test.mjs
        if: hashFiles('scripts/check-pr-policy.mjs') != ''
      - run: node scripts/check-pr-policy.mjs
        if: hashFiles('scripts/check-pr-policy.mjs') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
