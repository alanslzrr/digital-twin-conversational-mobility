name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit runtime and development dependencies
        run: pnpm audit --audit-level=high
      - name: Verify patched deployment CLI
        run: pnpm exec vercel --version
      - run: pnpm check
      - run: pnpm build:agent
      - name: Verify local database and HTTP boundaries
        run: |
          pnpm setup:local
          pnpm infra:up
          pnpm db:migrate
          pnpm db:migrate
          pnpm db:check
          pnpm --filter @mobility/core start >/tmp/mobility-core.log 2>&1 &
          CORE_PID=$!
          pnpm --filter @mobility/eve-web start >/tmp/eve-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$CORE_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null && curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          pnpm smoke --production
      - name: Stop local services
        if: always()
        run: |
          if [ -f .env.local ]; then pnpm infra:down; fi
