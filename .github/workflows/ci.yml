name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Scan reachable Git history for secrets
        run: |
          ARCHIVE="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$ARCHIVE"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $ARCHIVE" | sha256sum --check
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all"
      - run: pnpm install --frozen-lockfile
      - name: Audit runtime and development dependencies
        run: pnpm audit --audit-level=moderate
      - name: Verify cloud configuration stays disabled
        run: node scripts/check-cloud-disabled.mjs
      - run: pnpm check
      - name: Verify Docker is ready for the existing agent build
        run: |
          # EVE probes Docker once with a 5s timeout, then caches the result.
          # Warm/verify the existing CI prerequisite before that bounded probe.
          for attempt in $(seq 1 6); do
            if [ "$(timeout 15 docker version --format '{{.Server.Os}}' 2>/dev/null)" = linux ]; then
              break
            fi
            sleep 2
          done
          test "$(timeout 15 docker version --format '{{.Server.Os}}')" = linux
      - run: pnpm build:agent
      - name: Verify local database and HTTP boundaries
        run: |
          pnpm setup:local
          pnpm infra:up
          pnpm db:migrate
          pnpm db:migrate
          pnpm db:check
          pnpm --filter @mobility/core start >/tmp/mobility-core.log 2>&1 &
          CORE_PID=$!
          pnpm --filter @mobility/eve-web start >/tmp/eve-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$CORE_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null && curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          pnpm smoke --production
          pnpm smoke:evaluation
      - name: Verify dashboard SQL and authenticated HTTP in disposable schemas
        env:
          RUN_DASHBOARD_DB_TESTS: "1"
        run: |
          node --env-file=.env.local node_modules/vitest/vitest.mjs run apps/mobility-core/src/dashboard apps/mobility-core/src/observability/dashboard.integration.test.ts
          node --env-file=.env.local scripts/test-dashboard-local.mjs
      - name: Stop local services
        if: always()
        run: |
          if [ -f .env.local ]; then pnpm infra:down; fi
