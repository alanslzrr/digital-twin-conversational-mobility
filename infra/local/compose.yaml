name: mobility-twin-local
services:
  otp:
    image: opentripplanner/opentripplanner:2.10.0@sha256:8d54e5c589186707ee365417f2202dc878c451fa3001b8edff07019531100933
    profiles: [routing]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx4g -XX:ActiveProcessorCount=4
    mem_limit: 6g
    cpus: 4
    ports:
      - 127.0.0.1:8801:8080
    volumes:
      - ../../data/otp:/var/opentripplanner
    command: [--load, --serve]
    restart: "no"
  postgres:
    image: postgis/postgis:17-3.5
    # The official tag is amd64; Docker Desktop emulates it on Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup:local}
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm setup:local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local}
    ports:
      - 127.0.0.1:55432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: "no"
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run pnpm setup:local}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    ports:
      - 127.0.0.1:56379:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"
volumes:
  postgres-data:
  redis-data:
